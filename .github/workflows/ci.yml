name: ci

on:
  pull_request:
    branches: [devel, stage]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: .

      - name: Run linter
        run: npm run lint
        working-directory: .

      - name: Run tests
        run: CI=true npm run test
        working-directory: .

      - name: Build application
        run: npm run build
        working-directory: .
